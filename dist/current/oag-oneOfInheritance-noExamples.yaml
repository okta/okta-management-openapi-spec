    TokenRevocationRequest:
      x-okta-lifecycle:
        lifecycle: EA
        isGenerallyAvailable: false
        SKUs: []
      type: object
      properties:
        client_id:
          type: string
          description: The client ID. Provide this value if you are not using HTTP Basic Auth.
        client_secret:
          type: string
          description: The client secret. Provide this value if you are not using HTTP Basic Auth.
          writeOnly: true
        token:
          type: string
          description: The access token or refresh token to revoke
        token_type_hint:
          type: string
          description: A hint to the authorization server about the type of token being submitted. If it's omitted, the server attempts to determine the token type automatically.
          enum:
            - access_token
            - refresh_token
          x-enumDescriptions:
            access_token: The submitted token is an access token
            refresh_token: The submitted token is a refresh token
      required:
