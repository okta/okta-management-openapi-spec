        response_types_supported:
          type: array
          items:
            type: string
          description: A list of the `response_type` values that this authorization server supports. It can be a combination of `code`, `token`, and `id_token`.
        revocation_endpoint:
          type: string
          description: URL of the authorization server's revocation endpoint
        scopes_supported:
          type: array
          items:
            type: string
          description: A list of the scope values that this authorization server supports
        token_endpoint:
          type: string
          description: URL of the authorization server's token endpoint
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
          description: A list of client authentication methods supported by this token endpoint
        userinfo_endpoint:
          type: string
          description: URL of the authorization server's userinfo endpoint
    Policy:
      type: object
      properties:
        active:
          type: boolean
          default: true
          description: Policy status
        caseSensitive:
          type: boolean
          description: Indicates whether the policy resource is case sensitive
          default: true
        customDirective:
          type: string
          format: multi-line string
          description: |-
            Custom NGINX directives that handle special requirements not covered by the policy type.
            There is no limit to the number of directives you can add, but each directive must be on its own line.
        description:
          type: string
          description: Policy description
        id:
          type: string
          format: uuid
          description: Unique identifier of the policy
          readOnly: true
        name:
          type: string
          description: Policy name
        regexRule:
          type: string
          description: |-
            Regular expression (regex) that can control authorization for the given resource

            See [Protected Rule resource-matching rule expressions](https://help.okta.com/okta_help.htm?type=oag&id=policy-protected-rule-expressions).
        resourcePath:
          type: string
          description: The path to the resource that the policy manages
        rule:
          type: string
          enum:
            - NO_AUTH
            - PROTECTED
            - PROTECTED_REGEX
            - ADAPTIVE
            - CUSTOM
          description: |-
            Policy type

            See [Policy types](https://help.okta.com/okta_help.htm?type=oag&id=ext_oag_about_pol_types)
          x-enumDescriptions:
            NO_AUTH: The resource is not protected by any policy
            PROTECTED: This policy requires a valid session (authenticated user) to access the associated resource
            PROTECTED_REGEX: This policy requires a valid session and an expression that determines who can access the resource
            ADAPTIVE: This policy extends the Not Protected policy, but passes header information to the underlying app
            CUSTOM: This policy extends the Protected Rule policy, but supports entering a regular expression as the URI
    PolicyCreateRequest:
      allOf:
        - $ref: '#/components/schemas/Policy'
        - type: object
          required:
            - name
            - resourcePath
            - rule
    PolicyUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/Policy'
        - type: object
          required:
            - name
            - resourcePath
            - rule
    ProtectedResource:
      type: object
      properties:
        active:
          type: boolean
          default: true
          description: Indicates whether the protected resource is active or not. If set to `true`, the resource is considered active and is used for routing requests.
        assignedWeight:
          type: integer
          default: 1
          minimum: 0
          maximum: 100
          description: |-
            The associated weight assigned to the protected resource. This weight is used to determine how requests are distributed among multiple protected resources.

            You can assign a value from `0` to `100`. `0` (zero) means that a host isn't in use.

            For example, a weight value of `1` routes an equal number of requests to each protected web resource.
            A weight value of `2` routes twice as many requests to protected web resources with this weight than those with a weight of `1`. If one protected web resource has a weight of `1` and the other has a weight of `2`, `66%` of the total requests are routed to the resource with a weight of `2`.
        calculatedWeight:
          type: number
          format: float
          description: The calculated weight percentage that's based on the assigned weight distribution of all resources in the application. Values are represented as decimals. For example, `1.0` equals 100% distribution and `0.5` equals 50% distribution.
          readOnly: true
        hostname:
          type: string
          format: uri
          pattern: ^https?://[a-zA-Z0-9.-]+(:[0-9]{1,5})?/?$
          description: |-
            The hostname of the protected web resource URL

            The URL must include the protocol, host, and port.
        id:
          type: string
          format: uuid
          description: Unique identifier of the protected resource
          readOnly: true
    ProtectedResourceCreateRequest:
      allOf:
        - $ref: '#/components/schemas/ProtectedResource'
        - type: object
          required:
            - hostname
    ProtectedResourceUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/ProtectedResource'
        - type: object
          required:
            - hostname
    ResourceNotFound:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            errorCode:
              type: string
              example: NOT_FOUND
            message:
              type: string
              example: The requested resource could not be found
    SamlApplicationCreateRequest:
      x-okta-lifecycle:
        lifecycle: EA
        isGenerallyAvailable: false
        SKUs: []
      allOf:
        - $ref: '#/components/schemas/SamlApplicationRequest'
      type: object
      required:
        - type
        - label
        - idpId
        - clientId
        - acsUrl
        - postLoginUrl
        - logoutUrl
    SamlApplicationProperties:
      type: object
      properties:
        acsUrl:
          type: string
          format: uri
          pattern: ^https?://[a-zA-Z0-9.-]+(:[0-9]{1,5})?(?:/[A-Za-z0-9._~!$&'()*+,;=:@%/-]*)?(?:\?[A-Za-z0-9._~!$&'()*+,;=:@%/?-]*)?(?:#[A-Za-z0-9._~!$&'()*+,;=:@%/?-]*)?$
          description: The Assertion Consumer Service (ACS) URL where the SAML assertion is sent after authentication
        binding:
          type: string
          description: The SAML binding that's used for communication between the service provider (SP) and IdP
          enum:
            - HTTP_POST
            - HTTP_REDIRECT
          default: HTTP_POST
        clientId:
          type: string
          description: The unique identifier of the SP entity
        clientSignature:
          type: boolean
          description: Indicates whether SAML requests are expected to be signed by the SP or not. When `clientSignature` is `true`, SAML requests are signed by the SP and you must provide a value for `spCertificate`. When it's `false`, SAML requests aren't signed by the SP and the `spCertificate` value is ignored.
          default: false
        encryptAssertion:
          type: boolean
          description: Indicates whether SAML assertions are required to be encrypted by the IdP or not. When `encryptAssertion` is `true`, the SAML assertion must be encrypted by the IdP before it's sent to the SP. When it's `false`, the assertion can be sent without encryption.
          default: false
        encryptionAlgorithm:
          type: string
          description: The encryption algorithm that's used for SAML assertions
          enum:
            - AES128_CBC
            - AES256_CBC
            - TRIPLE_DES_CBC
          default: AES256_CBC
        keyTransportAlgorithm:
          type: string
          description: The key transport algorithm that's used for SAML assertions
          enum:
            - RSA_OAEP
            - RSA_OAEP_256
            - RSA_V1_5
          default: RSA_OAEP_256
          x-enumDescriptions:
            RSA_OAEP: RSA Encryption Scheme (RSAES) that uses Optimal Asymmetric Encryption Padding (OAEP) using SHA-1 and Mask Generation Function 1 (MGF1) with SHA-1
            RSA_OAEP_256: RSAES that uses OAEP with SHA-256 and MGF1 with SHA-256
            RSA_V1_5: RSA v1.5 padding
        logoutUrl:
          type: string
          format: uri
          pattern: ^https?://[a-zA-Z0-9.-]+(:[0-9]{1,5})?(?:/[A-Za-z0-9._~!$&'()*+,;=:@%/-]*)?(?:\?[A-Za-z0-9._~!$&'()*+,;=:@%/?-]*)?(?:#[A-Za-z0-9._~!$&'()*+,;=:@%/?-]*)?$
          description: The single logout URL for the SAML application. This is the URL where users are redirected to initiate the logout process with the Identity Provider (IdP) when [`singleLogout`](https://developer.okta.com/docs/api/openapi/oag/oag/tag/Application-Behavior/#tag/Application-Behavior/operation/replaceBehavior!path=singleLogout&t=request) is set to `true` in the application behavior configuration.
        nameIdFormat:
          type: string
          description: The `NameID` format that's used for SAML assertions
          enum:
            - EMAIL_ADDRESS
            - PERSISTENT
            - TRANSIENT
            - UNSPECIFIED
          default: UNSPECIFIED
          x-enumDescriptions:
            EMAIL_ADDRESS: The `NameID` is in the format of an email address.
            PERSISTENT: The `NameID` is a persistent, opaque identifier that doesn't change across sessions. It's typically used when the SP needs to recognize the user across multiple sessions without revealing their actual identity.
            TRANSIENT: The `NameID` is a temporary identifier that's generated for a single session. It changes with each new session and isn't meant to be stored or reused by the SP.
            UNSPECIFIED: The `NameID` format isn't specified. The IdP and SP may use a default format or determine the format based on other factors.
        postLoginUrl:
          type: string
          format: uri
          pattern: ^https?://[a-zA-Z0-9.-]+(:[0-9]{1,5})?(?:/[A-Za-z0-9._~!$&'()*+,;=:@%/-]*)?(?:\?[A-Za-z0-9._~!$&'()*+,;=:@%/?-]*)?(?:#[A-Za-z0-9._~!$&'()*+,;=:@%/?-]*)?$
          description: Relay state URL where end users are directed after they sign in. This is typically the URL of the application dashboard or homepage.
        signAssertion:
          type: boolean
          description: Indicates whether SAML assertions are expected to be signed by the IdP or not. When `signAssertion` is `true`, SAML assertions are signed by the IdP. When it's `false`, SAML assertions are sent without a signature.
          default: true
        signDocument:
          type: boolean
          description: Indicates whether SAML responses are expected to be signed by the IdP or not. When `signDocument` is `true`, SAML responses are signed by the IdP. When it's `false`, SAML responses are sent without a signature.
          default: false
        signingAlgorithm:
          type: string
          description: The signing algorithm that's used for SAML requests and responses
          enum:
            - RSA_SHA1
            - RSA_SHA256
            - RSA_SHA256_MGF1
            - RSA_SHA512
            - RSA_SHA512_MGF1
          default: RSA_SHA256
          x-enumDescriptions:
            RSA_SHA1: RSA signature with SHA-1 hashing algorithm
            RSA_SHA256: RSA signature with SHA-256 hashing algorithm
            RSA_SHA256_MGF1: RSA signature with SHA-256 hashing algorithm and MGF1 mask generation function
            RSA_SHA512: RSA signature with SHA-512 hashing algorithm
            RSA_SHA512_MGF1: RSA signature with SHA-512 hashing algorithm and MGF1 mask generation function
        spCertificate:
          type: string
          description: The Base64-encoded public certificate of the SP. This is required when `clientSignature`, `encryptAssertion`, `signAssertion`, or `signDocument` are set to `true`.
          writeOnly: true
        type:
          type: string
          description: The application type
          enum:
            - OAG_SAML
    SamlApplicationRequest:
      x-okta-lifecycle:
        lifecycle: EA
        isGenerallyAvailable: false
        SKUs: []
      allOf:
        - $ref: '#/components/schemas/ApplicationRequest'
        - $ref: '#/components/schemas/SamlApplicationProperties'
        - type: object
          properties:
            idpMetadata:
              type: string
              description: Base64-encoded metadata about the IdP that's used to set up the SAML integration
              readOnly: true
      type: object
    SamlApplicationResponse:
      $ref: '#/components/schemas/SamlApplicationRequest'
    SamlApplicationResponseWithEmbedded:
      x-okta-lifecycle:
        lifecycle: EA
        isGenerallyAvailable: false
        SKUs: []
      allOf:
        - $ref: '#/components/schemas/SamlApplicationRequest'
        - type: object
          properties:
            _embedded:
              type: object
              description: |-
                Additional configuration settings for applications that are returned when you use the `expand` query parameter. This object returns different settings based on the application type.

                SAML applications don't use Access Gateway as a proxy. As a result, the `_embedded` object doesn't return protected resources, health checks, application policy settings, and session settings. The application session is controlled by the application itself and none of the session settings are returned in the `_embedded` object.

                For SAML applications, the `_embedded` object only returns the `behavior` and `attributes` settings. Many of the application behavior settings are related to the application session only and aren't applicable for SAML applications. `singleLogout`, `universalLogout`, `globalTokenRevocation`, and `globalTokenRevocationEndpoint` are the only applicable behavior settings for SAML applications.
              readOnly: true
              x-order: 99
              properties:
                behavior:
                  $ref: '#/components/schemas/BehaviorSAML'
                attributes:
                  type: array
                  items:
                    $ref: '#/components/schemas/Attribute'
                  description: Attributes configuration
    SamlApplicationUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/ApplicationUpdateRequest'
        - $ref: '#/components/schemas/SamlApplicationProperties'
        - type: object
          required:
            - clientId
            - acsUrl
            - postLoginUrl
            - logoutUrl
          properties:
            type:
              type: string
              description: The application type
              enum:
                - OAG_SAML
      type: object
    ServiceUnavailable:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            errorCode:
              type: string
              example: SERVICE_UNAVAILABLE
            message:
              type: string
              example: The server is currently unable to handle the request due to initializing
    Session:
      description: Application session configuration
      type: object
      properties:
        auth:
          type: string
          enum:
            - HEADER
            - NOAUTH
            - IWA
            - EBS
          description: Authentication type
        browserSessionExpiration:
          type: boolean
          description: Indicates whether app sessions expire when the browser is closed. If `browserSessionExpiration` is `true`, the app session expires when the browser is closed.
        deepLinking:
          type: boolean
          description: Indicates whether your application dynamically redirects browsers to application URIs after sign-in. If `deepLinking` is `false`, the browser redirects to the post sign-in URL after sign-in.
        enforceDeepLinkingDomain:
          type: boolean
          description: Indicates whether your application only allows deep links that share the public domain name. If a deep link domain doesn't match the public domain name, Access Gateway only uses the post login URL.
        idleSession:
          type: boolean
          description: Indicates whether app sessions can expire after a certain amount of idle time. If `idleSession` is `true`, the session expires after a period of inactivity, determined by the `idleSessionTimeout` value.
        idleSessionTimeout:
          type: integer
          description: |-
            The amount of idle time, in seconds, before an app session expires. This value is ignored if `idleSession` is `false`.
            The maximum value for this field is determined by the `maxSessionTimeout` value. The value of `idleSessionTimeout` must be less than or equal to `maxSessionTimeout`.
          minimum: 60
          default: 3600
        maxSession:
          type: boolean
          description: Indicates whether app sessions can expire after a certain amount of time, regardless of activity. If `maxSession` is `true`, the session expires after a period of time, determined by the `maxSessionTimeout` value.
        maxSessionTimeout:
          type: integer
          description: |-
            The amount of time, in seconds, before an app session expires, regardless of activity. This value is ignored if `maxSession` is `false`.
            The minimum value for this field is determined by the `idleSessionTimeout` value. The value of `maxSessionTimeout` must be greater than or equal to `idleSessionTimeout`.
            Setting `maxSessionTimeout` to `0` means that the app session never expires which is similar to setting `maxSession` to `false`.
          default: 28800
    TokenIntrospectionRequest:
      x-okta-lifecycle:
        lifecycle: EA
        isGenerallyAvailable: false
        SKUs: []
      type: object
      properties:
        client_id:
          type: string
          description: The client ID of the application that requested the token
        client_secret:
          type: string
          description: The client secret.
        token:
          type: string
          description: The token to introspect
        token_type_hint:
          type: string
          description: A hint to the authorization server about the type of token being submitted. If omitted, the server attempts to determine the token type automatically.
          enum:
            - access_token
            - refresh_token
          x-enumDescriptions:
            access_token: The submitted token is an access token
            refresh_token: The submitted token is a refresh token
      required:
        - token
        - client_id
    TokenIntrospectionResponse:
      x-okta-lifecycle:
        lifecycle: EA
        isGenerallyAvailable: false
        SKUs: []
      type: object
      properties:
        active:
          type: boolean
          description: Indicates whether the token is currently valid. A token is active if it has not expired and has not been revoked.
        aud:
          type: string
          description: The audience of the token
        client_id:
          type: string
          description: The client ID for which the token was issued
        exp:
          type: integer
          description: UNIX timestamp of when the token expires
        iat:
          type: integer
          description: UNIX timestamp of when the token was issued
        iss:
          type: string
          description: The issuer of the token
        scope:
          type: string
          description: The scopes granted to the token
        sub:
          type: string
          description: The subject (user) that the token was issued for
        token_type:
          type: string
          description: The token type that indicates how the token should be used. A Bearer token can be used by any party that holds it without additional proof of identity.
        username:
          type: string
          description: The username of the user that the token was issued for
      required:
        - active
    TokenRequest:
      x-okta-lifecycle:
        lifecycle: EA
        isGenerallyAvailable: false
        SKUs: []
      type: object
      properties:
        client_assertion:
          type: string
          description: A signed JWT that's used to authenticate the client. Required when using `client_secret_jwt` or `private_key_jwt` authentication.
          writeOnly: true
        client_assertion_type:
          type: string
          description: The format of the client assertion. Required when using `client_secret_jwt` or `private_key_jwt` authentication.
          enum:
            - urn:ietf:params:oauth:client-assertion-type:jwt-bearer
        client_id:
          type: string
          description: The client ID of the application
        client_secret:
          type: string
          description: The client secret. Not required for public clients or when using PKCE.
          writeOnly: true
        code:
          type: string
          description: The authorization code. Required for the `authorization_code` grant type.
        code_verifier:
          type: string
          description: The PKCE code verifier. Required when using PKCE.
        grant_type:
          type: string
          description: The grant type for the token request
          enum:
            - authorization_code
            - refresh_token
            - client_credentials
        redirect_uri:
          type: string
          description: The redirect URI used in the authorization request
        refresh_token:
          type: string
          description: The refresh token. Required for the `refresh_token` grant type.
        scope:
          type: string
          description: Space-separated list of scopes
      required:
        - grant_type
    TokenResponse:
      x-okta-lifecycle:
        lifecycle: EA
        isGenerallyAvailable: false
        SKUs: []
      type: object
      properties:
        access_token:
          type: string
          description: The access token
        expires_in:
          type: integer
          description: The lifetime in seconds of the access token
        id_token:
          type: string
          description: The ID token (JWT containing user information) that's issued when the `openid` scope is requested
        refresh_token:
          type: string
          description: The refresh token that's issued when the `offline_access` scope is requested
        scope:
          type: string
          description: The granted scopes
        token_type:
          type: string
          description: The token type. It's always `Bearer` for tokens that are issued by the token endpoint.
