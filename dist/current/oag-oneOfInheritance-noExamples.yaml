    IdPOfflineModeHealthPolicy:
      type: object
      properties:
        failureThreshold:
          type: integer
          description: |-
            The number of consecutive failed health checks that must occur before marking the Okta IdP service as unhealthy.

            The Okta IdP service is considered unhealthy when Access Gateway can't connect to the IdP after a certain number of retry attempts. After the Okta IdP reaches the failure threshold, failover to offline mode (if failover is enabled) is triggered and sign in requests are redirected to the offline mode IdP.
          default: 3
          minimum: 1
          maximum: 10
        healthCheckInterval:
          type: integer
          description: The amount of time, in seconds, between health check requests
          default: 60
          minimum: 60
          maximum: 300
          enum:
            - 60
            - 120
            - 180
            - 240
            - 300
        maxRetries:
          type: integer
          description: The maximum number of retry attempts for failed health checks
          default: 3
          minimum: 0
          maximum: 5
        recoveryCooldownInterval:
          type: integer
          description: |-
            The interval, in seconds, that Access Gateway waits after `successThreshold` is met and the Okta IdP is marked healthy before it reconnects to the Okta IdP and exits offline mode.

            The value of `recoveryCooldownInterval` must be at least twice the time it takes Access Gateway to detect a failure, which is the product of the `healthCheckInterval` value multiplied by the `failureThreshold` value. This minimum interval prevents Access Gateway from alternating between online and offline mode. A shorter cooldown could let Access Gateway reconnect, hit the same failure again almost immediately, and fail over before the recovery is confirmed to be stable.

            For example, with a value of `60` for `healthCheckInterval` and `3` for `failureThreshold`, `recoveryCooldownInterval` must be at least `360` seconds. Any value greater than or equal to this minimum is valid. The value can't exceed the maximum allowed value of `6000` seconds.
          default: 360
          minimum: 120
          maximum: 6000
        successThreshold:
          type: integer
          description: The number of consecutive successful health checks that must occur before marking the Okta IdP service as healthy
          default: 2
          minimum: 1
          maximum: 10
        timeout:
          type: integer
          description: The amount of time, in seconds, that a health check HTTPS request can take before it's considered a failure
          default: 3
          minimum: 1
          maximum: 10
