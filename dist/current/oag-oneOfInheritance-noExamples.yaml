components:
  parameters:
    AccessPolicyID:
      in: path
      name: accessPolicyId
      required: true
      description: Identifier of the access policy
      schema:
        type: string
        format: uuid
    ApplicationID:
      name: applicationId
      in: path
      required: true
      description: Identifier of the application
      schema:
        type: string
        format: uuid
    AttributeID:
      in: path
      name: attributeId
      required: true
      description: Identifier of the attribute
      schema:
        type: string
        format: uuid
    AuthenticationServiceCertificateType:
      in: path
      name: type
      required: true
      description: The virtual host type for the authentication service certificate
      schema:
        $ref: '#/components/schemas/AuthenticationServiceCertificateTypeEnum'
    AuthenticatorID:
      in: path
      name: authenticatorId
      required: true
      description: Identifier of the offline mode authenticator
      schema:
        type: string
        format: uuid
    AuthorizeClientId:
      name: client_id
      in: query
      required: true
      description: The client ID of the OAuth 2.0 client
      schema:
        type: string
    AuthorizeCodeChallenge:
      name: code_challenge
      in: query
      description: The PKCE code challenge derived from the code verifier. It's required when using the authorization code flow with PKCE.
      schema:
        type: string
    AuthorizeCodeChallengeMethod:
      name: code_challenge_method
      in: query
      description: The method that's used to derive the code challenge
      schema:
        type: string
        enum:
          - S256
    AuthorizeNonce:
      name: nonce
      in: query
      description: A random string included in the authorization request and embedded in the ID token. It's used to associate the token with a client session.
      schema:
        type: string
    AuthorizePrompt:
      name: prompt
      in: query
      description: Controls whether the authorization server prompts the user during the authorization request
      schema:
        type: string
        enum:
