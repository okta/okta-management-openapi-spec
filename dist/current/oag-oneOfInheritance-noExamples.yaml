        type: string
    AuthorizeScope:
      name: scope
      in: query
      description: |-
        A space-separated list of scope values. Supported scopes:
        - `openid`: Required for OIDC authentication. Grants access to the `sub` claim in the ID token.
        - `profile`: Grants access to the user's profile information, including `name`, `given_name`, `family_name`, `preferred_username`, `picture`, and `updated_at`.
        - `email`: Grants access to the user's `email` and `email_verified` claims.
        - `offline_access`: Grants a refresh token that allows the client to obtain new access tokens without user interaction. Requires the `refresh_token` grant type to be enabled.
      schema:
        type: string
    AuthorizeState:
      name: state
