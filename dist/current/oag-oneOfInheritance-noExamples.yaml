          - consent
          - none
      x-enumDescriptions:
        login: Forces the user to authenticate, even if the user already has an active session
        consent: Forces the user to grant consent, even if consent was previously granted
        none: Returns an error if the user is not already authenticated or consent has not been granted
    AuthorizeRedirectUri:
      name: redirect_uri
      in: query
      required: true
      description: The redirect URI where the authorization code is sent
